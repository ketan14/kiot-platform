# Supabase Local Configuration for KIOT Platform
[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 5432
major_version = 16

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5174", "http://localhost:5175"]
jwt_expiry = 3600

[storage]
enabled = false

