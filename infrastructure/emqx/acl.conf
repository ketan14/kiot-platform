%% =============================================================================
%% KIOT Platform – EMQX 5.x Multi-Tenant Topic Access Control List (ACL)
%% File: infrastructure/emqx/acl.conf
%% =============================================================================
%% Enforces strict multi-tenant MQTT topic isolation for Edge Gateways,
%% ESP32 Sensor Nodes, and Internal Ingestion Workers.
%% =============================================================================

%% 1. Internal KIOT Backend Services & Shared Subscription Workers
{allow, {user, "kiot_worker"}, all, ["$share/ingestion_group/kiot/#", "kiot/#"]}.
{allow, {client, {re, "^kiot_device_worker_.*"}}, all, ["$share/ingestion_group/kiot/#", "kiot/#"]}.
{allow, {client, {re, "^kiot_api_.*"}}, publish, ["kiot/+/devices/+/commands"]}.

%% 2. Industrial Edge Gateways (Publish telemetry & heartbeats for their Organization)
{allow, {client, {re, "^kiot-edge-gateway-.*"}}, publish, [
  "kiot/+/gateways/+/heartbeat",
  "kiot/+/devices/+/telemetry",
  "kiot/+/devices/+/state"
]}.
{allow, {client, {re, "^kiot-edge-gateway-.*"}}, subscribe, [
  "kiot/+/devices/+/commands"
]}.

%% 3. Individual ESP32 Edge Nodes (Sandboxed strictly to their own client/device ID)
{allow, all, publish, [
  "kiot/+/devices/${clientid}/telemetry",
  "kiot/+/devices/${clientid}/state",
  "kiot/+/devices/${clientid}/commands/+/ack"
]}.
{allow, all, subscribe, [
  "kiot/+/devices/${clientid}/commands",
  "kiot/+/devices/${clientid}/shadow/#"
]}.

%% 4. Default Deny All Unmatched Topics
{deny, all}.
