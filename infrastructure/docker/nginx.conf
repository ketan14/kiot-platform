# ==============================================================================
# KIOT Platform - Unified Nginx Reverse Proxy Configuration
# Routes all platform services under a single domain & port: http://kiot.local:40000
# ==============================================================================

# Compression
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

server {
    listen 80;
    server_name kiot.local localhost 127.0.0.1;

    # Maximum upload payload (firmware binaries, telemetry batches)
    client_max_body_size 64M;

    # --------------------------------------------------------------------------
    # 1. Fastify REST API Service (/v1/ -> Fastify Port 3000)
    # --------------------------------------------------------------------------
    location /v1/ {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 2. Interactive OpenAPI / Swagger Documentation (/docs -> Port 3000)
    # --------------------------------------------------------------------------
    location /docs {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 3. Real-Time Telemetry WebSocket Gateway (/ws -> WS Gateway Port 3001)
    # --------------------------------------------------------------------------
    location /ws {
        proxy_pass http://host.docker.internal:3001;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep connection open indefinitely for telemetry heartbeats
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # 4. Database Web UI (Adminer / phpMyAdmin equivalent -> Port 8080)
    # --------------------------------------------------------------------------
    location /adminer/ {
        proxy_pass http://adminer:8080/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect /adminer (without trailing slash) to /adminer/
    location = /adminer {
        return 301 /adminer/;
    }

    # --------------------------------------------------------------------------
    # 5. EMQX Web Dashboard Quick Redirect
    # --------------------------------------------------------------------------
    location = /emqx {
        return 302 http://$host:18083;
    }
    location = /emqx/ {
        return 302 http://$host:18083;
    }

    # --------------------------------------------------------------------------
    # 6. Industrial Frontend Web Application (React 19 + Vite HMR -> Port 5175)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://host.docker.internal:5175;
        proxy_http_version 1.1;

        # WebSocket support for Vite Hot Module Replacement (HMR)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded request headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for instant streaming/updates
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
